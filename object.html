<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>
<body>
    <script>
        //predefined objects of js:Array

        //1.push
        let a = [1,2,3,4,5];
        a.push(6);
        document.writeln(a);
        //2.pop
        a.pop();
        document.writeln(a);
        //3.concat
        let d = ['a','s','d'];
        document.writeln(a.concat(d));
        //4.unshift
        let f = a.unshift(10);
        document.writeln(f);
        //5.shift 
        let shift = a.shift();
        //6.splice
        let s = a.splice(2,1);
        document.writeln(s);
        //7.length
        let l = a.length;
        document.writeln(l);
        

        
    </script>
    
    
</body>
</html>
