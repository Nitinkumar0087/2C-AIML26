<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function display(){
            for(let i=1;i<=4;i++){

                for( let j = 1;j<= i;j++){
                    document.write("* ");
                }
                document.write("<br>");
            }
        }
    </script>
</head>
<body>
    <input type="button" onclick="display()" value="pattern">
    
</body>
</html>
